name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r flask_auth_app/requirements.txt
          pip install -r flask_auth_app/requirements-dev.txt

      - name: Run tests
        working-directory: flask_auth_app
        run: python -m pytest tests/ -v --tb=short

      - name: Test coverage report
        working-directory: flask_auth_app
        run: python -m pytest tests/ --cov=game --cov-report=term-missing --cov-fail-under=60
