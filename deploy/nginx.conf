# Nginx reverse proxy for Septica
# 1. Copy this file to /etc/nginx/sites-available/septica
# 2. Replace YOUR_DOMAIN_OR_IP with your actual domain or EC2 public IP
# 3. sudo ln -s /etc/nginx/sites-available/septica /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx
# After getting an SSL certificate run: sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Flask app (WebSocket-aware proxy)
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Required for Socket.IO / WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout so ongoing games are not killed mid-session
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }
}
