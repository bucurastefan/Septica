services:
  web:
    build: ./flask_auth_app
    ports:
      - "5000:5000"
    env_file:
      - ./flask_auth_app/.env
    environment:
      FLASK_ENV: production
      DATABASE_URL: sqlite:////app/data/septica.db
    volumes:
      # Database persists here — back this directory up regularly
      - septica_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  septica_data:
