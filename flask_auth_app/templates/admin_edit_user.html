{% extends "base.html" %}

{% block title %}Edit User - Admin Panel{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0">Edit User</h4>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('admin_edit_user', user_id=user.id) }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">New Password (leave blank to keep current)</label>
                    <input type="password" class="form-control" id="password" name="password">
                    <div class="form-text">Only fill this if you want to change the user's password.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Account Creation Date</label>
                    <input type="text" class="form-control" value="{{ user.created_at.strftime('%Y-%m-%d %H:%M:%S') }}" readonly>
                    <div class="form-text">This field cannot be changed.</div>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('admin_user_details', user_id=user.id) }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-warning">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
