{% extends "base.html" %}

{% block title %}Home - Flask Auth App{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0">Welcome to your Dashboard</h4>
            </div>
            <div class="card-body">
                <h5 class="card-title">Hello, {{ username }}!</h5>
                <p class="card-text">You have successfully logged in to your account.</p>
                <p class="card-text">Your registered email: <strong>{{ email }}</strong></p>
                <hr>
                <div class="d-grid gap-2">
                    <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
