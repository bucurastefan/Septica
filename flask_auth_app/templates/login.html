{% extends "base.html" %}

{% block title %}Login - Șeptică{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="auth-container animate-fade-in">
            <h2 class="page-title text-center mb-4">Welcome Back</h2>
            <div class="auth-card">
                <div class="card-header">
                    <i class="fas fa-lock me-2"></i> Login to Your Account
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="form-group mb-3">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                            </div>
                        </div>
                        <div class="form-group mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt me-2"></i> Login
                            </button>
                        </div>
                    </form>
                    
                    <hr class="my-3">
                    
                    <!-- Guest Login Section -->
                    <div class="text-center">
                        <h6 class="mb-3">Or play as a guest</h6>
                        <form method="POST" action="{{ url_for('auth.guest_login') }}">
                            <div class="form-group mb-3">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user-ninja"></i></span>
                                    <input type="text" class="form-control" name="guest_name" placeholder="Enter guest name" required maxlength="20">
                                </div>
                                <small class="form-text text-muted">Guest data will be deleted after session ends</small>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-outline-primary">
                                    <i class="fas fa-user-ninja me-2"></i> Play as Guest
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="card-footer text-center py-3">
                    <p class="mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-bold">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
